<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>JUMYOU Craft - マルチプレイ ボクセルワールド</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#87CEEB;font-family:'Segoe UI',Meiryo,sans-serif;}
  canvas{display:block;}

  #crosshair{
    position:fixed;top:50%;left:50%;width:18px;height:18px;
    transform:translate(-50%,-50%);pointer-events:none;z-index:10;
  }
  #crosshair::before,#crosshair::after{
    content:"";position:absolute;background:rgba(255,255,255,0.85);
    box-shadow:0 0 1px rgba(0,0,0,0.6);
  }
  #crosshair::before{left:8px;top:0;width:2px;height:18px;}
  #crosshair::after{top:8px;left:0;width:18px;height:2px;}

  #hud{
    position:fixed;top:10px;left:10px;color:#fff;font-size:13px;
    text-shadow:0 1px 2px rgba(0,0,0,0.8);z-index:10;line-height:1.5;
    background:rgba(0,0,0,0.25);padding:8px 12px;border-radius:6px;
    pointer-events:none;
  }
  #players{
    position:fixed;top:10px;right:10px;color:#fff;font-size:12px;
    text-shadow:0 1px 2px rgba(0,0,0,0.8);z-index:10;text-align:right;
    background:rgba(0,0,0,0.25);padding:8px 12px;border-radius:6px;
    pointer-events:none;min-width:120px;
  }
  #hotbar{
    position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
    display:flex;gap:6px;z-index:10;
  }
  .slot{
    width:48px;height:48px;border:2px solid rgba(255,255,255,0.4);
    border-radius:6px;background:rgba(0,0,0,0.35);
    display:flex;align-items:center;justify-content:center;
    flex-direction:column;color:#fff;font-size:10px;
  }
  .slot.active{border-color:#fff;background:rgba(255,255,255,0.25);}
  .swatch{width:22px;height:22px;border-radius:3px;margin-bottom:2px;border:1px solid rgba(0,0,0,0.3);}

  #startScreen{
    position:fixed;inset:0;background:linear-gradient(#6ec6ff,#bfe6ff);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    z-index:100;color:#1c2b1a;
  }
  #startScreen h1{font-size:38px;margin:0 0 6px;letter-spacing:1px;color:#2f5d34;text-shadow:2px 2px 0 rgba(255,255,255,0.6);}
  #startScreen p{margin:4px 0;font-size:14px;color:#28381f;}
  #nameInput{
    margin-top:14px;padding:10px 14px;font-size:14px;border-radius:6px;
    border:2px solid #2f5d34;width:220px;text-align:center;
  }
  #startBtn{
    margin-top:14px;padding:12px 34px;font-size:16px;font-weight:bold;
    background:#3d7a41;color:#fff;border:none;border-radius:8px;cursor:pointer;
    box-shadow:0 3px 0 #24501f;
  }
  #startBtn:active{transform:translateY(2px);box-shadow:none;}
  #controlsInfo{margin-top:22px;font-size:12px;color:#28381f;text-align:center;line-height:1.7;background:rgba(255,255,255,0.35);padding:10px 18px;border-radius:8px;}

  #status{position:fixed;bottom:10px;left:10px;color:#fff;font-size:11px;z-index:10;text-shadow:0 1px 2px rgba(0,0,0,0.8);pointer-events:none;}
</style>
</head>
<body>

<div id="startScreen">
  <h1>⛏ JUMYOU Craft</h1>
  <p>Firebaseで同期するミニ・ボクセルワールド</p>
  <input id="nameInput" type="text" placeholder="プレイヤー名" maxlength="10">
  <button id="startBtn">ワールドに入る</button>
  <div id="controlsInfo">
    WASD: 移動　　Space: ジャンプ　　マウス: 視点<br>
    左クリック: ブロックを壊す　　右クリック: ブロックを置く<br>
    1〜4キー: 草 / 土 / 石 / 木 を選択　　Esc: マウス解除
  </div>
</div>

<div id="crosshair" style="display:none;"></div>
<div id="hud" style="display:none;"></div>
<div id="players" style="display:none;"></div>
<div id="status" style="display:none;">接続中...</div>

<div id="hotbar" style="display:none;">
  <div class="slot active" data-type="grass"><div class="swatch" style="background:#5da53c;"></div>草</div>
  <div class="slot" data-type="dirt"><div class="swatch" style="background:#8b5a2b;"></div>土</div>
  <div class="slot" data-type="stone"><div class="swatch" style="background:#8a8a8a;"></div>石</div>
  <div class="slot" data-type="wood"><div class="swatch" style="background:#6b4423;"></div>木</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.128.0/three.min.js"></script>

<script>
/* ============================================================
   Firebase 初期化
============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBqDRgzhHOvUcUoV_JHm9zFJ1IS_CA0394",
  authDomain: "jumyou.firebaseapp.com",
  databaseURL: "https://jumyou-default-rtdb.firebaseio.com",
  projectId: "jumyou",
  storageBucket: "jumyou.firebasestorage.app",
  messagingSenderId: "441346887929",
  appId: "1:441346887929:web:0ca3115f8d1f806df49228",
  measurementId: "G-FBZF2NHEC9"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const myId = "p_" + Math.random().toString(36).substr(2, 9);
let myName = "Player";

/* ============================================================
   定数 / ブロック定義
============================================================ */
const CHUNK_SIZE = 16;
const RENDER_RADIUS = 2;      // ロードするチャンク半径
const DEPTH_CAP = 6;          // 各カラムで描画する最大深さ

const BLOCK_COLORS = {
  grass: 0x5da53c,
  dirt:  0x8b5a2b,
  stone: 0x8a8a8a,
  wood:  0x6b4423
};
const blockGeo = new THREE.BoxGeometry(1, 1, 1);
const blockMats = {};
for (const k in BLOCK_COLORS) {
  blockMats[k] = new THREE.MeshLambertMaterial({ color: BLOCK_COLORS[k] });
}

/* ============================================================
   地形生成（決定論的 = 全クライアント共通）
============================================================ */
function naturalHeight(x, z) {
  const h = Math.sin(x * 0.1) * 3 + Math.cos(z * 0.13) * 3 + Math.sin((x + z) * 0.05) * 2;
  return Math.max(1, Math.floor(h) + 8);
}
function naturalMaterial(y, top) {
  if (y === top) return "grass";
  if (y >= top - 2) return "dirt";
  return "stone";
}

/* カラムデータ: key "x_z" -> { top, placed:{y:type} } (naturalTopと異なる場合のみ保存) */

/* ============================================================
   Three.js セットアップ
============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fd0ff);
scene.fog = new THREE.Fog(0x8fd0ff, 40, 90);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);

const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
document.body.appendChild(renderer.domElement);

const ambient = new THREE.AmbientLight(0xffffff, 0.65);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffffff, 0.7);
sun.position.set(50, 80, 30);
scene.add(sun);

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ============================================================
   チャンク管理
============================================================ */
const chunks = new Map();      // key -> { columns: Map("x_z"->{top,placed}), group: THREE.Group, fbRef, dirtyBuild }
let chunkListeners = new Map();

function chunkKey(cx, cz) { return cx + "_" + cz; }
function worldToChunk(x, z) { return [Math.floor(x / CHUNK_SIZE), Math.floor(z / CHUNK_SIZE)]; }

function getColumn(chunk, lx, lz) {
  const key = lx + "_" + lz;
  let col = chunk.columns.get(key);
  if (!col) {
    const wx = chunk.cx * CHUNK_SIZE + lx;
    const wz = chunk.cz * CHUNK_SIZE + lz;
    col = { top: naturalHeight(wx, wz), placed: {}, natTop: naturalHeight(wx, wz) };
    chunk.columns.set(key, col);
  }
  return col;
}

function applyOverride(chunk, lx, lz, override) {
  const col = getColumn(chunk, lx, lz);
  if (override) {
    if (typeof override.top === "number") col.top = override.top;
    if (override.placed) col.placed = override.placed;
  }
}

function createChunk(cx, cz) {
  const key = chunkKey(cx, cz);
  if (chunks.has(key)) return chunks.get(key);
  const chunk = { cx, cz, columns: new Map(), group: new THREE.Group(), needsRebuild: true };
  scene.add(chunk.group);
  chunks.set(key, chunk);

  // Firebase から差分をロードして監視
  const ref = db.ref("world/" + key);
  const listener = ref.on("value", (snap) => {
    const data = snap.val() || {};
    for (const colKey in data) {
      const [lx, lz] = colKey.split("_").map(Number);
      applyOverride(chunk, lx, lz, data[colKey]);
    }
    chunk.needsRebuild = true;
  });
  chunk.fbRef = ref;
  chunk.fbListener = listener;
  return chunk;
}

function destroyChunk(cx, cz) {
  const key = chunkKey(cx, cz);
  const chunk = chunks.get(key);
  if (!chunk) return;
  chunk.fbRef.off("value", chunk.fbListener);
  scene.remove(chunk.group);
  chunk.group.traverse((obj) => {
    if (obj.geometry) obj.geometry.dispose();
  });
  chunks.delete(key);
}

function rebuildChunkMesh(chunk) {
  // 既存メッシュ破棄
  while (chunk.group.children.length) {
    const c = chunk.group.children.pop();
    if (c.geometry) c.geometry.dispose();
  }

  const buckets = { grass: [], dirt: [], stone: [], wood: [] };

  for (let lx = 0; lx < CHUNK_SIZE; lx++) {
    for (let lz = 0; lz < CHUNK_SIZE; lz++) {
      const col = getColumn(chunk, lx, lz);
      const wx = chunk.cx * CHUNK_SIZE + lx;
      const wz = chunk.cz * CHUNK_SIZE + lz;
      const top = col.top;
      const minY = Math.max(0, top - DEPTH_CAP);
      for (let y = top; y >= minY; y--) {
        let type;
        if (y > col.natTop) {
          type = col.placed[y] || "wood";
        } else {
          type = naturalMaterial(y, col.natTop);
        }
        buckets[type].push(wx, y, wz);
      }
    }
  }

  for (const type in buckets) {
    const coords = buckets[type];
    const count = coords.length / 3;
    if (count === 0) continue;
    const mesh = new THREE.InstancedMesh(blockGeo, blockMats[type], count);
    const m = new THREE.Matrix4();
    for (let i = 0; i < count; i++) {
      m.makeTranslation(coords[i * 3] + 0.5, coords[i * 3 + 1] + 0.5, coords[i * 3 + 2] + 0.5);
      mesh.setMatrixAt(i, m);
    }
    mesh.instanceMatrix.needsUpdate = true;
    chunk.group.add(mesh);
  }
  chunk.needsRebuild = false;
}

function updateLoadedChunks(px, pz) {
  const [ccx, ccz] = worldToChunk(px, pz);
  const wanted = new Set();
  for (let dx = -RENDER_RADIUS; dx <= RENDER_RADIUS; dx++) {
    for (let dz = -RENDER_RADIUS; dz <= RENDER_RADIUS; dz++) {
      const cx = ccx + dx, cz = ccz + dz;
      wanted.add(chunkKey(cx, cz));
      if (!chunks.has(chunkKey(cx, cz))) createChunk(cx, cz);
    }
  }
  for (const key of Array.from(chunks.keys())) {
    if (!wanted.has(key)) {
      const [cx, cz] = key.split("_").map(Number);
      destroyChunk(cx, cz);
    }
  }
}

function columnAt(wx, wz) {
  const [cx, cz] = worldToChunk(wx, wz);
  const chunk = chunks.get(chunkKey(cx, cz));
  if (!chunk) return null;
  const lx = wx - cx * CHUNK_SIZE, lz = wz - cz * CHUNK_SIZE;
  return { chunk, lx, lz, col: getColumn(chunk, lx, lz) };
}

function saveColumnOverride(wx, wz) {
  const info = columnAt(wx, wz);
  if (!info) return;
  const key = info.lx + "_" + info.lz;
  const chunk = info.chunk;
  const data = { top: info.col.top };
  if (Object.keys(info.col.placed).length) data.placed = info.col.placed;
  db.ref("world/" + chunkKey(chunk.cx, chunk.cz) + "/" + key).set(data);
}

function breakBlockAt(wx, wz) {
  const info = columnAt(wx, wz);
  if (!info || info.col.top < 0) return;
  const col = info.col;
  if (col.top > col.natTop) {
    delete col.placed[col.top];
  }
  col.top -= 1;
  info.chunk.needsRebuild = true;
  saveColumnOverride(wx, wz);
}

function placeBlockAt(wx, wz, type) {
  const info = columnAt(wx, wz);
  if (!info) return;
  const col = info.col;
  col.top += 1;
  col.placed[col.top] = type;
  info.chunk.needsRebuild = true;
  saveColumnOverride(wx, wz);
}

function heightAt(wx, wz) {
  const info = columnAt(wx, wz);
  if (info) return info.col.top;
  return naturalHeight(wx, wz);
}

/* ============================================================
   プレイヤー / 操作
============================================================ */
const player = {
  x: 0, y: 0, z: 0,
  vy: 0,
  yaw: 0, pitch: 0,
  onGround: false,
  selected: "grass",
  moveSpeed: 5.5,
};

const keys = {};
document.addEventListener("keydown", (e) => {
  keys[e.code] = true;
  const map = { Digit1: "grass", Digit2: "dirt", Digit3: "stone", Digit4: "wood" };
  if (map[e.code]) selectSlot(map[e.code]);
});
document.addEventListener("keyup", (e) => keys[e.code] = false);

function selectSlot(type) {
  player.selected = type;
  document.querySelectorAll(".slot").forEach((el) => {
    el.classList.toggle("active", el.dataset.type === type);
  });
}
document.querySelectorAll(".slot").forEach((el) => {
  el.addEventListener("click", () => selectSlot(el.dataset.type));
});

const canvas = renderer.domElement;
let pointerLocked = false;
canvas.addEventListener("click", () => {
  if (!pointerLocked) canvas.requestPointerLock();
});
document.addEventListener("pointerlockchange", () => {
  pointerLocked = (document.pointerLockElement === canvas);
});
document.addEventListener("mousemove", (e) => {
  if (!pointerLocked) return;
  const sens = 0.0022;
  player.yaw -= e.movementX * sens;
  player.pitch -= e.movementY * sens;
  player.pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, player.pitch));
});

canvas.addEventListener("mousedown", (e) => {
  if (!pointerLocked) return;
  const hit = raycastVoxel();
  if (!hit) return;
  if (e.button === 0) {
    breakBlockAt(hit.x, hit.z);
  } else if (e.button === 2) {
    placeBlockAt(hit.x, hit.z, player.selected);
  }
});
canvas.addEventListener("contextmenu", (e) => e.preventDefault());

/* シンプルなDDAレイキャスト：カラム(高さマップ)ベース */
function raycastVoxel() {
  const dir = new THREE.Vector3(0, 0, -1).applyEuler(new THREE.Euler(player.pitch, player.yaw, 0, "YXZ"));
  const pos = new THREE.Vector3(player.x, player.y + 1.6, player.z);
  const step = 0.15, maxDist = 6;
  for (let t = 0; t < maxDist; t += step) {
    const px = pos.x + dir.x * t;
    const py = pos.y + dir.y * t;
    const pz = pos.z + dir.z * t;
    const wx = Math.floor(px), wz = Math.floor(pz);
    const top = heightAt(wx, wz);
    if (py <= top + 1 && py >= top - DEPTH_CAP) {
      if (Math.floor(py) <= top) {
        return { x: wx, z: wz };
      }
    }
  }
  return null;
}

/* ============================================================
   物理・移動
============================================================ */
function updatePlayer(dt) {
  const forward = new THREE.Vector3(Math.sin(player.yaw), 0, Math.cos(player.yaw));
  const right = new THREE.Vector3(Math.sin(player.yaw + Math.PI / 2), 0, Math.cos(player.yaw + Math.PI / 2));
  let move = new THREE.Vector3();
  if (keys["KeyW"]) move.sub(forward);
  if (keys["KeyS"]) move.add(forward);
  if (keys["KeyA"]) move.sub(right);
  if (keys["KeyD"]) move.add(right);
  if (move.lengthSq() > 0) {
    move.normalize().multiplyScalar(player.moveSpeed * dt);
    player.x += move.x;
    player.z += move.z;
  }

  // 重力
  player.vy -= 18 * dt;
  player.y += player.vy * dt;

  const groundY = heightAt(Math.floor(player.x), Math.floor(player.z)) + 1;
  if (player.y <= groundY) {
    player.y = groundY;
    player.vy = 0;
    player.onGround = true;
  } else {
    player.onGround = false;
  }

  if (keys["Space"] && player.onGround) {
    player.vy = 7.2;
  }

  camera.position.set(player.x, player.y + 1.2, player.z);
  camera.rotation.order = "YXZ";
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;

  updateLoadedChunks(player.x, player.z);
}

/* ============================================================
   マルチプレイヤー同期
============================================================ */
const otherPlayers = new Map(); // id -> {mesh, label}
const playersRef = db.ref("players");
let lastSent = 0;

function makePlayerMesh(color) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(0.6, 1.2, 0.35),
    new THREE.MeshLambertMaterial({ color })
  );
  body.position.y = 0.6;
  const head = new THREE.Mesh(
    new THREE.BoxGeometry(0.45, 0.45, 0.45),
    new THREE.MeshLambertMaterial({ color: 0xf1c27d })
  );
  head.position.y = 1.42;
  g.add(body, head);
  return g;
}

function initMultiplayer() {
  const myColor = Math.floor(Math.random() * 0xffffff);
  const myRef = playersRef.child(myId);
  myRef.onDisconnect().remove();

  playersRef.on("value", (snap) => {
    const data = snap.val() || {};
    document.getElementById("players").innerHTML =
      "<b>オンライン: " + Object.keys(data).length + "</b><br>" +
      Object.values(data).map(p => (p.name || "?")).join("<br>");

    for (const id in data) {
      if (id === myId) continue;
      const p = data[id];
      let entry = otherPlayers.get(id);
      if (!entry) {
        const mesh = makePlayerMesh(p.color || 0xffcc00);
        scene.add(mesh);
        entry = { mesh };
        otherPlayers.set(id, entry);
      }
      entry.mesh.position.set(p.x, p.y, p.z);
      entry.mesh.rotation.y = p.yaw || 0;
    }
    for (const id of Array.from(otherPlayers.keys())) {
      if (!data[id]) {
        scene.remove(otherPlayers.get(id).mesh);
        otherPlayers.delete(id);
      }
    }
  });

  setInterval(() => {
    myRef.set({
      name: myName,
      color: myColor,
      x: player.x, y: player.y, z: player.z,
      yaw: player.yaw,
      t: Date.now()
    });
  }, 120);

  document.getElementById("status").textContent = "接続済み";
}

/* ============================================================
   メインループ
============================================================ */
let lastTime = performance.now();
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  updatePlayer(dt);

  for (const chunk of chunks.values()) {
    if (chunk.needsRebuild) rebuildChunkMesh(chunk);
  }

  document.getElementById("hud").innerHTML =
    "X: " + player.x.toFixed(1) + "　Y: " + player.y.toFixed(1) + "　Z: " + player.z.toFixed(1) +
    "<br>チャンク: " + Math.floor(player.x / CHUNK_SIZE) + ", " + Math.floor(player.z / CHUNK_SIZE);

  renderer.render(scene, camera);
}

/* ============================================================
   開始
============================================================ */
document.getElementById("startBtn").addEventListener("click", () => {
  const val = document.getElementById("nameInput").value.trim();
  myName = val || ("Player" + Math.floor(Math.random() * 1000));

  document.getElementById("startScreen").style.display = "none";
  document.getElementById("crosshair").style.display = "block";
  document.getElementById("hud").style.display = "block";
  document.getElementById("players").style.display = "block";
  document.getElementById("hotbar").style.display = "flex";
  document.getElementById("status").style.display = "block";

  player.x = 0.5; player.z = 0.5;
  player.y = heightAt(0, 0) + 2;

  updateLoadedChunks(player.x, player.z);
  initMultiplayer();
  canvas.requestPointerLock();
  animate();
});
</script>
</body>
</html>
