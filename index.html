<!DOCTYPE html>

<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }

  }

    width:38px; height:38px; border-radius:5px; border:2px solid rgba(255,255,255,.4);
    background:#555; overflow:hidden;

  .hotslot.selected { border-color:#fff; box-shadow:0 0 6px rgba(255,255,255,.9); }
  .hotslot canvas { width:100%; height:100%; image-rendering:pixelated; }

  #lookLayer { position:absolute; inset:0; pointer-events:auto; }

  #fpsBadge { font-size:10px; opacity:.6; color:#fff; margin-top:2px; }
</style>

<body>

<div id="startScreen">
  <h1>⛏ Mini Craft Online</h1>
  <p>できるだけ軽量に再現したMinecraft風ワールドです。ブロックを壊す・置く・仲間とリアルタイム同期ができます。スマホの縦持ち／横持ち両対応。</p>

<canvas id="gameCanvas"></canvas>

<script>
// ------------------------------------------------------------
// 外部スクリプトを順番に・確実に読み込むローダー
// (CDNが失敗しても代替CDNへフォールバックし、それでも失敗したら
//  Firebase無しのオフラインモードで起動する)
// ------------------------------------------------------------
function loadScript(urls){
  return new Promise((resolve)=>{
    let i = 0;
    function tryNext(){
      if(i >= urls.length){ resolve(false); return; }
      const s = document.createElement("script");
      s.src = urls[i++];
      s.onload = ()=>resolve(true);
      s.onerror = tryNext;
      document.head.appendChild(s);
    }
    tryNext();
  });
}

async function bootstrap(){
  const statusEl = ()=>document.getElementById("startStatus");
  if(statusEl()) statusEl().textContent = "読み込み中...";

  const threeOk = await loadScript([
    "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js",
    "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js",
    "https://unpkg.com/three@0.128.0/build/three.min.js"
  ]);
  if(!threeOk || typeof THREE === "undefined"){
    if(statusEl()) statusEl().textContent = "⚠ 3D描画ライブラリの読込に失敗しました。通信環境を確認してください。";
    return;
  }

  const fbAppOk = await loadScript([
    "https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js",
    "https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-app-compat.js"
  ]);
  let fbDbOk = false;
  if(fbAppOk && typeof firebase !== "undefined"){
    fbDbOk = await loadScript([
      "https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js",
      "https://cdn.jsdelivr.net/npm/firebase@9.23.0/firebase-database-compat.js"
    ]);
  }
  const firebaseAvailable = fbAppOk && fbDbOk && typeof firebase !== "undefined";
  if(!firebaseAvailable && statusEl()){
    statusEl().textContent = "⚠ オンライン同期は利用できません(オフラインで遊べます)";
  }

  runGame(firebaseAvailable);
}
bootstrap();

function runGame(firebaseAvailable){
"use strict";

/* =========================================================
   Firebase 初期化
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyBqDRgzhHOvUcUoV_JHm9zFJ1IS_CA0394",
  authDomain: "jumyou.firebaseapp.com",
  databaseURL: "https://jumyou-default-rtdb.firebaseio.com",
  projectId: "jumyou",
  storageBucket: "jumyou.firebasestorage.app",
  messagingSenderId: "441346887929",
  appId: "1:441346887929:web:0ca3115f8d1f806df49228",
  measurementId: "G-FBZF2NHEC9"
};
let db = null;
if(firebaseAvailable){
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
  }catch(e){
    console.error("Firebase init failed:", e);
    db = null;
  }
}
const ROOM = "worlds/main";
const myId = (localStorage.getItem("mc_uid")) || ("p" + Math.random().toString(36).slice(2,10));
localStorage.setItem("mc_uid", myId);
let myName = "Player";
let myColor = "#" + Math.floor(Math.random()*0xffffff).toString(16).padStart(6,"0");

if(db){
  document.getElementById("startStatus").textContent = "接続確認中...";
  db.ref(".info/connected").on("value", snap=>{
    document.getElementById("startStatus").textContent = snap.val() ? "✅ サーバーに接続しました(みんなと同期プレイ可能)" : "⚠ 接続中...";
  });
} else {
  document.getElementById("startStatus").textContent = "⚠ オフラインモード(1人プレイ)で起動します";
}

/* =========================================================
   ワールド定義 (固定サイズ・軽量) 
   ========================================================= */
const WORLD_MIN = -12, WORLD_MAX = 11; // 24x24
const AIR=0, GRASS=1, DIRT=2, STONE=3, WOOD=4, LEAVES=5, SAND=6;
const worldMap = new Map(); // key "x,y,z" -> type
const overrides = new Map(); // Firebase由来の差分

function key(x,y,z){ return x+","+y+","+z; }
function terrainHeight(x,z){
  const n = Math.sin(x*0.45)*1.6 + Math.cos(z*0.35)*1.6 + Math.sin((x+z)*0.22)*1.1 + Math.cos(x*0.15-z*0.1)*0.8;
  return Math.max(1, Math.min(8, Math.round(4 + n)));
}
function hash2(x,z){
  let h = (x*374761393 + z*668265263) ^ (x*1274126177);
  h = (h ^ (h>>>13)) * 1274126177;
  return ((h ^ (h>>>16)) >>> 0) / 4294967295;
}

function generateBaseTerrain(){
  for(let x=WORLD_MIN;x<=WORLD_MAX;x++){
    for(let z=WORLD_MIN;z<=WORLD_MAX;z++){
      const h = terrainHeight(x,z);
      for(let y=0;y<h-2;y++) worldMap.set(key(x,y,z), STONE);
      for(let y=Math.max(0,h-2);y<h-1;y++) worldMap.set(key(x,y,z), DIRT);
      worldMap.set(key(x,h-1,z), GRASS);
      // 木をまばらに生やす
      if(hash2(x,z) > 0.965){
        const th = 3 + Math.floor(hash2(x+99,z+31)*2);
        for(let ty=0;ty<th;ty++) worldMap.set(key(x,h-1+1+ty,z), WOOD);
        const topY = h-1+th;
        for(let lx=-1;lx<=1;lx++) for(let lz=-1;lz<=1;lz++) for(let ly=-1;ly<=1;ly++){
          if(Math.abs(lx)+Math.abs(lz)+Math.abs(ly) <= 2){
            const k = key(x+lx, topY+ly, z+lz);
            if(!worldMap.has(k)) worldMap.set(k, LEAVES);
          }
        }
      }
    }
  }
}
generateBaseTerrain();

function getBlock(x,y,z){
  if(y < -1) return STONE; // 底面（奈落防止）
  if(y > 30) return AIR;
  const k = key(x,y,z);
  if(overrides.has(k)) return overrides.get(k);
  return worldMap.get(k) || AIR;
}
function setLocalBlock(x,y,z,type){
  overrides.set(key(x,y,z), type);
}

/* =========================================================
   Three.js 基本セットアップ
   ========================================================= */
const canvas = document.getElementById("gameCanvas");
const renderer = new THREE.WebGLRenderer({ canvas, antialias:false, powerPreference:"low-power" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fc7f0);
scene.fog = new THREE.Fog(0x8fc7f0, 14, 34);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.05, 60);
camera.rotation.order = "YXZ";

const hemi = new THREE.HemisphereLight(0xffffff, 0x6b5a3f, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3d0, 0.85);
sun.position.set(15, 25, 10);
scene.add(sun);

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", ()=>setTimeout(resize,200));
resize();

/* =========================================================
   ブロックテクスチャ（キャンバスで軽量生成 / ドット絵風）
   ========================================================= */
function makeTexture(draw){
  const c = document.createElement("canvas"); c.width = 16; c.height = 16;
  const ctx = c.getContext("2d");
  draw(ctx);
  const tex = new THREE.CanvasTexture(c);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  return tex;
}
function noiseFill(ctx, base, variants){
  for(let x=0;x<16;x++) for(let y=0;y<16;y++){
    const c = variants[Math.floor(Math.random()*variants.length)];
    ctx.fillStyle = c; ctx.fillRect(x,y,1,1);
  }
}
const texGrassTop = makeTexture(ctx=>{ noiseFill(ctx, "#6ab04c", ["#6ab04c","#5ea347","#7bc158","#63a648"]); });
const texDirt = makeTexture(ctx=>{ noiseFill(ctx, "#8a5a34", ["#8a5a34","#7e5230","#956338","#7a4e2c"]); });
const texGrassSide = makeTexture(ctx=>{
  noiseFill(ctx, "#8a5a34", ["#8a5a34","#7e5230","#956338"]);
  for(let x=0;x<16;x++){ ctx.fillStyle = Math.random()>0.4?"#6ab04c":"#5ea347"; ctx.fillRect(x,0,1,4); }
});
const texStone = makeTexture(ctx=>{ noiseFill(ctx, "#8d8d8d", ["#8d8d8d","#828282","#979797","#787878"]); });
const texWoodSide = makeTexture(ctx=>{
  ctx.fillStyle="#6e4a28"; ctx.fillRect(0,0,16,16);
  for(let x=0;x<16;x+=3){ ctx.fillStyle="#5c3c20"; ctx.fillRect(x,0,1,16); }
});
const texWoodTop = makeTexture(ctx=>{
  ctx.fillStyle="#c9a06c"; ctx.fillRect(0,0,16,16);
  ctx.strokeStyle="#a9805050"; for(let r=2;r<9;r+=2){ ctx.beginPath(); ctx.arc(8,8,r,0,Math.PI*2); ctx.stroke(); }
});
const texLeaves = makeTexture(ctx=>{ noiseFill(ctx, "#3f8f3a", ["#3f8f3a","#357a31","#4aa143","#2f6e2c"]); });
const texSand = makeTexture(ctx=>{ noiseFill(ctx, "#ddd08a", ["#ddd08a","#d3c37c","#e6d894"]); });

function mat(tex){ return new THREE.MeshLambertMaterial({ map: tex }); }
const M_GRASS_TOP = mat(texGrassTop), M_GRASS_SIDE = mat(texGrassSide), M_DIRT = mat(texDirt);
const M_STONE = mat(texStone), M_WOOD_SIDE = mat(texWoodSide), M_WOOD_TOP = mat(texWoodTop);
const M_LEAVES = mat(texLeaves); M_LEAVES.transparent = false;
const M_SAND = mat(texSand);

const boxGeo = new THREE.BoxGeometry(1,1,1);

const BLOCK_DEFS = {
  [GRASS]: { materials: [M_GRASS_SIDE,M_GRASS_SIDE,M_GRASS_TOP,M_DIRT,M_GRASS_SIDE,M_GRASS_SIDE], max: 4000, name:"草" },
  [DIRT]:  { materials: M_DIRT, max: 3000, name:"土" },
  [STONE]: { materials: M_STONE, max: 6000, name:"石" },
  [WOOD]:  { materials: [M_WOOD_SIDE,M_WOOD_SIDE,M_WOOD_TOP,M_WOOD_TOP,M_WOOD_SIDE,M_WOOD_SIDE], max: 600, name:"木材" },
  [LEAVES]:{ materials: M_LEAVES, max: 1500, name:"葉" },
  [SAND]:  { materials: M_SAND, max: 500, name:"砂" },
};

const instMeshes = {};
const instLookup = {}; // type -> array index->[x,y,z]
for(const t in BLOCK_DEFS){
  const def = BLOCK_DEFS[t];
  const meshMat = Array.isArray(def.materials) ? def.materials : def.materials;
  const im = new THREE.InstancedMesh(boxGeo, meshMat, def.max);
  im.count = 0;
  im.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  scene.add(im);
  instMeshes[t] = im;
  instLookup[t] = [];
}

const dummy = new THREE.Object3D();
let rebuildQueued = false;
function queueRebuild(){ if(!rebuildQueued){ rebuildQueued = true; requestAnimationFrame(rebuildWorldMeshes); } }

function rebuildWorldMeshes(){
  rebuildQueued = false;
  const counts = {}; for(const t in BLOCK_DEFS) counts[t]=0;

  const seen = new Set();
  function place(x,y,z,type){
    if(type===AIR) return;
    const t = String(type);
    if(!BLOCK_DEFS[t]) return;
    const idx = counts[t]++;
    if(idx >= BLOCK_DEFS[t].max) return;
    dummy.position.set(x+0.5,y+0.5,z+0.5);
    dummy.updateMatrix();
    instMeshes[t].setMatrixAt(idx, dummy.matrix);
    instLookup[t][idx] = [x,y,z];
  }

  worldMap.forEach((type,k)=>{
    if(overrides.has(k)) return; // 上書きは後で処理
    const [x,y,z] = k.split(",").map(Number);
    place(x,y,z,type);
    seen.add(k);
  });
  overrides.forEach((type,k)=>{
    const [x,y,z] = k.split(",").map(Number);
    place(x,y,z,type);
  });

  for(const t in BLOCK_DEFS){
    instMeshes[t].count = counts[t];
    instMeshes[t].instanceMatrix.needsUpdate = true;
  }
}
queueRebuild();

/* =========================================================
   Firebaseからのブロック差分同期
   ========================================================= */
db.ref(ROOM + "/blocks").on("value", snap=>{
  const val = snap.val() || {};
  overrides.clear();
  Object.keys(val).forEach(k=>{
    const parts = k.split("_").map(Number);
    overrides.set(parts.join(","), val[k]);
  });
  queueRebuild();
});

function pushBlockChange(x,y,z,type){
  setLocalBlock(x,y,z,type);
  queueRebuild();
  db.ref(ROOM + "/blocks/" + x + "_" + y + "_" + z).set(type);
}

/* =========================================================
   プレイヤー（自分）
   ========================================================= */
const player = {
  pos: new THREE.Vector3(0, terrainHeight(0,0)+2, 0),
  vel: new THREE.Vector3(0,0,0),
  yaw: 0, pitch: -0.1,
  onGround: false,
  eyeHeight: 1.6,
};

function collides(px,py,pz){
  const r = 0.28;
  const heights = [0.05, 0.9, 1.55];
  for(const dx of [-r,r]) for(const dz of [-r,r]) for(const dy of heights){
    const bx = Math.floor(px+dx), by = Math.floor(py+dy), bz = Math.floor(pz+dz);
    if(getBlock(bx,by,bz) !== AIR) return true;
  }
  return false;
}

/* =========================================================
   入力処理 (タッチ: 移動スティック / 視点ドラッグ / ボタン)
   ========================================================= */
const input = { moveX:0, moveY:0, jump:false };

// --- 移動スティック ---
(function setupJoystick(){
  const base = document.getElementById("joyBase");
  const stick = document.getElementById("joyStick");
  let touchId = null, cx=0, cy=0;
  const maxR = 38;

  function start(e){
    const t = e.changedTouches ? e.changedTouches[0] : e;
    touchId = t.identifier ?? "mouse";
    const rect = base.getBoundingClientRect();
    cx = rect.left + rect.width/2; cy = rect.top + rect.height/2;
  }
  function move(e){
    const touches = e.changedTouches ? Array.from(e.changedTouches) : [e];
    for(const t of touches){
      if((t.identifier ?? "mouse") !== touchId) continue;
      let dx = t.clientX - cx, dy = t.clientY - cy;
      const dist = Math.min(maxR, Math.hypot(dx,dy));
      const ang = Math.atan2(dy,dx);
      dx = Math.cos(ang)*dist; dy = Math.sin(ang)*dist;
      stick.style.transform = `translate(${dx}px,${dy}px)`;
      input.moveX = dx/maxR; input.moveY = dy/maxR;
    }
  }
  function end(e){
    const touches = e.changedTouches ? Array.from(e.changedTouches) : [e];
    for(const t of touches){
      if((t.identifier ?? "mouse") !== touchId) continue;
      touchId = null; input.moveX = 0; input.moveY = 0;
      stick.style.transform = "translate(0,0)";
    }
  }
  base.addEventListener("touchstart", e=>{ e.preventDefault(); start(e); move(e); }, {passive:false});
  base.addEventListener("touchmove", e=>{ e.preventDefault(); move(e); }, {passive:false});
  base.addEventListener("touchend", e=>{ e.preventDefault(); end(e); }, {passive:false});
  base.addEventListener("mousedown", e=>{ start(e); const mv=ev=>move(ev), up=ev=>{end(ev); window.removeEventListener("mousemove",mv); window.removeEventListener("mouseup",up);}; window.addEventListener("mousemove",mv); window.addEventListener("mouseup",up); });
})();

// --- 視点ドラッグ (画面全体、ジョイスティック/ボタン領域は別要素なので干渉しない) ---
(function setupLook(){
  const layer = document.getElementById("lookLayer");
  let touchId = null, lastX=0, lastY=0;
  const SENS = 0.0035;

  function start(e){
    const t = e.changedTouches ? e.changedTouches[0] : e;
    touchId = t.identifier ?? "mouse";
    lastX = t.clientX; lastY = t.clientY;
  }
  function move(e){
    const touches = e.changedTouches ? Array.from(e.changedTouches) : [e];
    for(const t of touches){
      if((t.identifier ?? "mouse") !== touchId) continue;
      const dx = t.clientX - lastX, dy = t.clientY - lastY;
      lastX = t.clientX; lastY = t.clientY;
      player.yaw -= dx*SENS;
      player.pitch -= dy*SENS;
      player.pitch = Math.max(-1.5, Math.min(1.5, player.pitch));
    }
  }
  function end(e){
    const touches = e.changedTouches ? Array.from(e.changedTouches) : [e];
    for(const t of touches){ if((t.identifier ?? "mouse") === touchId) touchId = null; }
  }
  layer.addEventListener("touchstart", e=>{ start(e); }, {passive:true});
  layer.addEventListener("touchmove", e=>{ move(e); }, {passive:true});
  layer.addEventListener("touchend", end, {passive:true});
  layer.addEventListener("mousedown", e=>{ start(e); const mv=ev=>move(ev), up=ev=>{end(ev); window.removeEventListener("mousemove",mv); window.removeEventListener("mouseup",up);}; window.addEventListener("mousemove",mv); window.addEventListener("mouseup",up); });
})();

// --- ジャンプ / 破壊 / 設置ボタン ---
document.getElementById("jumpBtn").addEventListener("touchstart", e=>{ e.preventDefault(); input.jump = true; }, {passive:false});
document.getElementById("jumpBtn").addEventListener("mousedown", ()=> input.jump = true);

let selectedType = GRASS;
const HOTBAR_TYPES = [GRASS, DIRT, STONE, WOOD, LEAVES, SAND];
(function setupHotbar(){
  const bar = document.getElementById("hotbar");
  HOTBAR_TYPES.forEach((t,i)=>{
    const slot = document.createElement("div");
    slot.className = "hotslot" + (i===0 ? " selected":"");
    const c = document.createElement("canvas"); c.width=16; c.height=16;
    const ctx = c.getContext("2d");
    const def = BLOCK_DEFS[t];
    const m = Array.isArray(def.materials) ? def.materials[2] : def.materials;
    ctx.drawImage(m.map.image, 0,0);
    slot.appendChild(c);
    slot.addEventListener("touchstart", e=>{ e.preventDefault(); select(); }, {passive:false});
    slot.addEventListener("mousedown", select);
    function select(){
      selectedType = t;
      Array.from(bar.children).forEach(ch=>ch.classList.remove("selected"));
      slot.classList.add("selected");
    }
    bar.appendChild(slot);
  });
})();

const raycaster = new THREE.Raycaster();
raycaster.far = 6;
function raycastBlock(){
  raycaster.set(camera.position, camera.getWorldDirection(new THREE.Vector3()));
  let best = null;
  for(const t in instMeshes){
    const im = instMeshes[t];
    if(im.count === 0) continue;
    const hits = raycaster.intersectObject(im, false);
    if(hits.length && (!best || hits[0].distance < best.distance)){
      best = hits[0]; best.blockType = t;
    }
  }
  if(!best) return null;
  const pos = instLookup[best.blockType][best.instanceId];
  return { x:pos[0], y:pos[1], z:pos[2], normal: best.face.normal.clone().transformDirection(instMeshes[best.blockType].matrixWorld), distance: best.distance };
}

document.getElementById("breakBtn").addEventListener("touchstart", e=>{ e.preventDefault(); doBreak(); }, {passive:false});
document.getElementById("breakBtn").addEventListener("mousedown", doBreak);
document.getElementById("placeBtn").addEventListener("touchstart", e=>{ e.preventDefault(); doPlace(); }, {passive:false});
document.getElementById("placeBtn").addEventListener("mousedown", doPlace);

function doBreak(){
  const hit = raycastBlock();
  if(!hit) return;
  pushBlockChange(hit.x, hit.y, hit.z, AIR);
}
function doPlace(){
  const hit = raycastBlock();
  if(!hit) return;
  const nx = hit.x + Math.round(hit.normal.x);
  const ny = hit.y + Math.round(hit.normal.y);
  const nz = hit.z + Math.round(hit.normal.z);
  // 自分の体と重ならないようにする
  const dx = Math.abs(nx+0.5-player.pos.x), dy = Math.abs(ny+0.5-player.pos.y-0.8), dz = Math.abs(nz+0.5-player.pos.z);
  if(dx<0.6 && dy<1.2 && dz<0.6) return;
  pushBlockChange(nx, ny, nz, selectedType);
}

/* =========================================================
   他プレイヤー表示
   ========================================================= */
const otherPlayers = {}; // id -> {group, data}
function makeNameSprite(name, colorHex){
  const c = document.createElement("canvas"); c.width=128; c.height=32;
  const ctx = c.getContext("2d");
  ctx.font="bold 20px sans-serif"; ctx.textAlign="center";
  ctx.fillStyle="rgba(0,0,0,.45)"; ctx.fillRect(0,4,128,24);
  ctx.fillStyle="#fff"; ctx.fillText(name.slice(0,10), 64, 22);
  const tex = new THREE.CanvasTexture(c);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest:false }));
  spr.scale.set(1.4,0.35,1);
  spr.position.y = 2.15;
  return spr;
}
function createOtherPlayerMesh(name, colorHex){
  const group = new THREE.Group();
  const bodyMat = new THREE.MeshLambertMaterial({ color: colorHex||0x4488ff });
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.5,1.1,0.3), bodyMat);
  body.position.y = 0.85;
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.45,0.45,0.45), new THREE.MeshLambertMaterial({ color:0xf0c090 }));
  head.position.y = 1.6;
  group.add(body, head, makeNameSprite(name, colorHex));
  scene.add(group);
  return group;
}

const playersRef = db.ref(ROOM + "/players");
playersRef.child(myId).onDisconnect().remove();

let lastSent = 0;
function sendMyState(now){
  if(now - lastSent < 120) return;
  lastSent = now;
  playersRef.child(myId).set({
    x: +player.pos.x.toFixed(2), y: +player.pos.y.toFixed(2), z: +player.pos.z.toFixed(2),
    yaw: +player.yaw.toFixed(2), name: myName, color: myColor, t: now
  });
}

playersRef.on("value", snap=>{
  const val = snap.val() || {};
  const activeIds = new Set(Object.keys(val));
  // 追加/更新
  activeIds.forEach(id=>{
    if(id === myId) return;
    const d = val[id];
    if(!otherPlayers[id]){
      otherPlayers[id] = { group: createOtherPlayerMesh(d.name||"Player", d.color?parseInt(d.color.replace('#','0x')):0x4488ff), data:d };
    }
    const op = otherPlayers[id];
    op.data = d;
    op.group.position.set(d.x||0, d.y||0, d.z||0);
    op.group.rotation.y = (d.yaw||0) + Math.PI;
  });
  // 削除
  Object.keys(otherPlayers).forEach(id=>{
    if(!activeIds.has(id)){
      scene.remove(otherPlayers[id].group);
      delete otherPlayers[id];
    }
  });
  const list = Object.values(val).filter(d=>d).map(d=>d.name||"?");
  document.getElementById("playerList").textContent = "👥 " + (list.length||1) + "人: " + (list.join(", ")||myName);
});

/* =========================================================
   メインループ
   ========================================================= */
const clock = new THREE.Clock();
const SPEED = 4.3, GRAVITY = 20, JUMP_V = 7.2;
let fpsAcc=0, fpsCount=0, fpsTimer=0;

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());

  // 視点
  camera.rotation.set(player.pitch, player.yaw, 0, "YXZ");

  // 移動方向計算 (カメラyaw基準)
  const forward = -input.moveY, strafe = input.moveX;
  const mag = Math.min(1, Math.hypot(forward,strafe));
  let vx=0, vz=0;
  if(mag > 0.05){
    const sinY = Math.sin(player.yaw), cosY = Math.cos(player.yaw);
    vx = (strafe*cosY - forward*sinY) * SPEED;
    vz = (-strafe*sinY - forward*cosY) * SPEED;
  }

  // 重力・ジャンプ
  player.vel.y -= GRAVITY*dt;
  if(input.jump){
    if(player.onGround){ player.vel.y = JUMP_V; player.onGround=false; }
    input.jump = false;
  }

  // 衝突判定つき移動 (軸ごと)
  let nx = player.pos.x + vx*dt;
  if(!collides(nx, player.pos.y, player.pos.z)) player.pos.x = nx;
  let nz = player.pos.z + vz*dt;
  if(!collides(player.pos.x, player.pos.y, nz)) player.pos.z = nz;
  let ny = player.pos.y + player.vel.y*dt;
  if(!collides(player.pos.x, ny, player.pos.z)){
    player.pos.y = ny; player.onGround = false;
  } else {
    if(player.vel.y < 0) player.onGround = true;
    player.vel.y = 0;
  }
  if(player.pos.y < -5){ player.pos.set(0, terrainHeight(0,0)+3, 0); player.vel.set(0,0,0); }

  camera.position.set(player.pos.x, player.pos.y + player.eyeHeight, player.pos.z);

  const now = performance.now();
  sendMyState(now);

  renderer.render(scene, camera);

  fpsCount++; fpsTimer += dt;
  if(fpsTimer > 1){ document.getElementById("fpsBadge").textContent = fpsCount+" fps"; fpsCount=0; fpsTimer=0; }
}

  const nameVal = document.getElementById("nameInput").value.trim();

  resize();
  animate();
});
