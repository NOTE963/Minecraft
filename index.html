<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mini Craft Online</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Segoe UI', 'Hiragino Sans', sans-serif; touch-action:none; }

  #appRoot {
    position:fixed; top:0; left:0; width:100vw; height:100vh;
    overflow:hidden; background:#8fc7f0;
  }
  body.force-landscape #appRoot {
    width:100vh; height:100vw;
    transform: rotate(90deg) translateY(-100%);
    transform-origin: top left;
  }

  #gameCanvas { display:block; width:100%; height:100%; }

  #startScreen {
    position:absolute; inset:0; z-index:50;
    background:linear-gradient(180deg,#5b8def 0%,#a3d0f0 60%,#8ec96b 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
    color:#fff; text-shadow:2px 2px 0 rgba(0,0,0,.35); padding:16px;

  #startScreen p { font-size:12px; opacity:.9; max-width:420px; text-align:center; line-height:1.6; }

    width:200px; padding:9px 14px; font-size:15px; border-radius:6px; border:3px solid #4a3524;
    background:#dcd0b4; color:#3a2c1a; text-align:center; outline:none;
  }
  #startBtn {
    padding:10px 30px; font-size:16px; font-weight:700; color:#fff; background:#5c9e2f;
    border:3px solid #3d6b1f; border-bottom-width:6px; border-radius:6px; cursor:pointer;
    text-shadow:1px 1px 0 rgba(0,0,0,.3);
  }
  #startBtn:active { border-bottom-width:3px; transform:translateY(3px); }
  #startStatus { font-size:11px; opacity:.85; }
  #rotateHint { font-size:11px; opacity:.8; margin-top:-4px; }

  #hud { position:absolute; inset:0; z-index:20; pointer-events:none; display:none; }

    position:absolute; top:50%; left:50%; width:16px; height:16px; transform:translate(-50%,-50%);

  /* ★ アクションボタン（さらに内側） */
  #actionArea {
    position:absolute; right:40px; bottom:40px;
    display:flex; flex-direction:column; align-items:flex-end; gap:12px;

  .actionRow { display:flex; gap:14px; }
  .abtn {
    width:64px; height:64px; border-radius:50%;
    background:rgba(20,20,20,.5); border:2px solid rgba(255,255,255,.6);
    display:flex; align-items:center; justify-content:center;
    font-size:26px; color:#fff;

  .abtn:active { background:rgba(20,20,20,.8); transform:scale(0.92); }
  #jumpBtn { width:72px; height:72px; font-size:13px; font-weight:700; }

  /* ★ インベントリ表示 */
  #inventoryDisplay {
    position:absolute; bottom:120px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.5); padding:6px 14px; border-radius:10px;
    display:flex; gap:10px; pointer-events:none; font-size:11px; color:#fff;
  }
  .inv-item {
    display:flex; align-items:center; gap:4px;
    background:rgba(255,255,255,.1); padding:2px 8px; border-radius:6px;
  }

  /* ★ ホットバー（クリック選択可） */
  #hotbar {
    position:absolute; top:12px; left:50%; transform:translateX(-50%);

  .hotslot {
    width:40px; height:40px; flex:0 0 auto; border-radius:6px;

  .hotslot .slot-count {

    text-shadow:0 0 3px rgba(0,0,0,.8);

  .hotslot .slot-label {
    position:absolute; top:0; left:2px;
    font-size:7px; font-weight:700; color:rgba(255,255,255,.6);
    text-shadow:0 0 3px rgba(0,0,0,.8);
    pointer-events:none;
  }

  #lookLayer { position:absolute; inset:0; pointer-events:auto; }
</style>

<script>
(function(){

localStorage.setItem("mc_uid", myId);

/* =========================================================
   横画面固定
   ========================================================= */
let ROTATED = false;
function updateOrientationMode(){
  ROTATED = window.innerHeight > window.innerWidth;
  document.body.classList.toggle("force-landscape", ROTATED);
}
updateOrientationMode();

function toLogicalDelta(dxs, dys){
  if(ROTATED) return { dx: dys, dy: -dxs };
  return { dx: dxs, dy: dys };
}

/* =========================================================
   ノイズ関数
   ========================================================= */
function hashInt(x,z,seed){
  let h = (x*374761393 + z*668265263 + seed*2246822519) | 0;
  h = (h ^ (h>>>13)) * 1274126177 | 0;
  h = (h ^ (h>>>16)) >>> 0;
  return h / 4294967295;
}
function smoothT(t){ return t*t*(3-2*t); }
function lerp(a,b,t){ return a+(b-a)*t; }
function valueNoise2D(x,z,seed){
  const x0=Math.floor(x), z0=Math.floor(z);
  const sx=smoothT(x-x0), sz=smoothT(z-z0);
  const n00=hashInt(x0,z0,seed), n10=hashInt(x0+1,z0,seed);
  const n01=hashInt(x0,z0+1,seed), n11=hashInt(x0+1,z0+1,seed);
  return lerp(lerp(n00,n10,sx), lerp(n01,n11,sx), sz);
}
function fbm(x,z,seed,octaves){
  let total=0, amp=1, freq=1, maxAmp=0;
  for(let i=0;i<octaves;i++){
    total += valueNoise2D(x*freq, z*freq, seed+i*17) * amp;
    maxAmp += amp; amp*=0.5; freq*=2.13;
  }
  return total/maxAmp;
}

/* =========================================================
   地形・バイオーム定義
   ========================================================= */
const AIR=0, GRASS=1, DIRT=2, STONE=3, WOOD=4, LEAVES=5, SAND=6;

const BIOME_DESERT=0, BIOME_PLAINS=1, BIOME_FOREST=2, BIOME_MOUNTAIN=3;

function columnBiome(x,z){
  const v = fbm(x*0.015, z*0.015, 900, 3);
  if(v<0.32) return BIOME_DESERT;
  if(v<0.58) return BIOME_PLAINS;
  if(v<0.80) return BIOME_FOREST;
  return BIOME_MOUNTAIN;
}

function columnHeight(x,z){
  const biome = columnBiome(x,z);
  const n = fbm(x*0.06, z*0.06, 100, 4);
  let base, amp;
  if(biome===BIOME_DESERT){ base=3; amp=2; }
  else if(biome===BIOME_PLAINS){ base=4; amp=2.5; }
  else if(biome===BIOME_FOREST){ base=5; amp=3.2; }
  else { base=7; amp=15; }
  let h;
  if(biome===BIOME_MOUNTAIN) h = Math.round(base + Math.pow(n,1.5)*amp);
  else h = Math.round(base + n*amp);
  return Math.max(1, Math.min(36, h));
}

function surfaceBlockFor(biome,h){
  if(biome===BIOME_DESERT) return SAND;
  if(biome===BIOME_MOUNTAIN && h>17) return STONE;
  return GRASS;
}

function columnHasTree(x,z,biome){
  if(biome===BIOME_DESERT || biome===BIOME_MOUNTAIN) return false;
  const chance = biome===BIOME_FOREST ? 0.06 : 0.015;
  return hashInt(x*7+3, z*13+5, 777) < chance;
}

function columnTreeHeight(x,z){
  return 3 + Math.floor(hashInt(x+51, z+19, 321)*3);
}

function terrainBlockAt(x,y,z){
  const biome = columnBiome(x,z);
  const h = columnHeight(x,z);
  
  if(y >= h){
    for(let dx=-1;dx<=1;dx++) for(let dz=-1;dz<=1;dz++){
      const nx=x+dx, nz=z+dz;
      const nb = columnBiome(nx,nz);
      if(!columnHasTree(nx,nz,nb)) continue;
      const nh = columnHeight(nx,nz);
      const th = columnTreeHeight(nx,nz);
      if(dx===0 && dz===0 && y>=nh && y<nh+th) return WOOD;
      const leafBaseY = nh+th-1;
      const ly = y-leafBaseY;
      if(Math.abs(dx)+Math.abs(dz)+Math.abs(ly)<=2 && y>=nh && ly>=-1 && ly<=1) return LEAVES;
    }
    return AIR;
  }
  
  if(y === h-1) return surfaceBlockFor(biome,h);
  if(y >= h-4) return (biome===BIOME_DESERT ? SAND : DIRT);
  return STONE;
}

/* =========================================================
   インベントリ（所持ブロック管理）
   ========================================================= */
const inventory = {};
const BLOCK_NAMES = {
  [GRASS]: "草", [DIRT]: "土", [STONE]: "石",
  [WOOD]: "木材", [LEAVES]: "葉", [SAND]: "砂"
};

function addToInventory(type, count){
  if(type === AIR) return;
  if(!inventory[type]) inventory[type] = 0;
  inventory[type] += count;
  updateInventoryDisplay();
  updateHotbarCounts();
}

function getInventoryCount(type){
  return inventory[type] || 0;
}

function useFromInventory(type){
  if(!inventory[type] || inventory[type] <= 0) return false;
  inventory[type]--;
  updateInventoryDisplay();
  updateHotbarCounts();
  return true;
}

function updateInventoryDisplay(){
  const container = document.getElementById("inventoryDisplay");
  const keys = Object.keys(inventory).filter(k => inventory[k] > 0);
  if(keys.length === 0){
    container.innerHTML = '<span style="color:#888;font-size:10px;">インベントリ空</span>';
    return;
  }
  let html = "";
  const sorted = keys.sort((a,b) => parseInt(a) - parseInt(b));
  for(const k of sorted){
    const name = BLOCK_NAMES[k] || "不明";
    html += `<div class="inv-item">
      <span style="font-size:12px;">${name}</span>
      <span class="count">${inventory[k]}</span>
    </div>`;
  }
  container.innerHTML = html;
}

/* =========================================================
   ワールド差分（Firebase同期）
   ========================================================= */
const overrides = new Map();
function key(x,y,z){ return x+","+y+","+z; }
function getBlock(x,y,z){
  if(y < -40) return STONE;
  if(y > 60) return AIR;
  const k = key(x,y,z);
  if(overrides.has(k)) return overrides.get(k);
  return terrainBlockAt(x,y,z);
}

/* =========================================================
   Three.js セットアップ
   ========================================================= */
const canvas = document.getElementById("gameCanvas");
const renderer = new THREE.WebGLRenderer({ canvas, antialias:false, powerPreference:"low-power" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8fc7f0);
scene.fog = new THREE.Fog(0x8fc7f0, 20, 62);

const camera = new THREE.PerspectiveCamera(70, 16/9, 0.05, 90);
camera.rotation.order = "YXZ";

// 昼夜サイクル用の光
const hemi = new THREE.HemisphereLight(0xffffff, 0x6b5a3f, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3d0, 0.85);
sun.position.set(15, 25, 10);
scene.add(sun);
const ambient = new THREE.AmbientLight(0x404060, 0.3);
scene.add(ambient);

let timeOfDay = 0; // 0-1 (0=夜, 0.5=昼)

function updateDayNight(dt){
  timeOfDay += dt * 0.008;
  if(timeOfDay > 1) timeOfDay -= 1;
  
  const angle = timeOfDay * Math.PI * 2;
  const height = Math.sin(angle);
  const sunX = Math.cos(angle) * 30;
  const sunZ = Math.sin(angle) * 30;
  const sunY = Math.max(-5, Math.sin(angle) * 25 + 5);
  
  sun.position.set(sunX, sunY, sunZ);
  
  const brightness = Math.max(0.1, Math.min(1, (height + 1) / 2));
  sun.intensity = 0.3 + brightness * 0.7;
  ambient.intensity = 0.05 + brightness * 0.3;
  
  const skyR = 0.35 + brightness * 0.4;
  const skyG = 0.5 + brightness * 0.35;
  const skyB = 0.7 + brightness * 0.2;
  scene.background = new THREE.Color(skyR, skyG, skyB);
  scene.fog.color = new THREE.Color(skyR, skyG, skyB);
  
  const isDay = height > 0.1;
  document.getElementById("timeDisplay").textContent = isDay ? "☀️ 昼" : "🌙 夜";
}

function resize(){
  updateOrientationMode();
  const realW = window.innerWidth, realH = window.innerHeight;
  const w = ROTATED ? realH : realW;
  const h = ROTATED ? realW : realH;
  renderer.setSize(w, h, false);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", ()=>setTimeout(resize,50));
window.addEventListener("orientationchange", ()=>setTimeout(resize,200));
resize();

/* =========================================================
   ブロックテクスチャ
   ========================================================= */
function makeTexture(draw){
  const c = document.createElement("canvas"); c.width = 16; c.height = 16;
  const ctx = c.getContext("2d");
  draw(ctx);
  const tex = new THREE.CanvasTexture(c);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  tex.generateMipmaps = false;
  return tex;
}
function noiseFill(ctx, variants){
  for(let x=0;x<16;x++) for(let y=0;y<16;y++){
    ctx.fillStyle = variants[Math.floor(Math.random()*variants.length)];
    ctx.fillRect(x,y,1,1);
  }
}
const texGrassTop = makeTexture(ctx=>{ noiseFill(ctx, ["#6ab04c","#5ea347","#7bc158","#63a648"]); });
const texDirt = makeTexture(ctx=>{ noiseFill(ctx, ["#8a5a34","#7e5230","#956338","#7a4e2c"]); });
const texGrassSide = makeTexture(ctx=>{
  noiseFill(ctx, ["#8a5a34","#7e5230","#956338"]);
  for(let x=0;x<16;x++){ ctx.fillStyle = Math.random()>0.4?"#6ab04c":"#5ea347"; ctx.fillRect(x,0,1,4); }
});
const texStone = makeTexture(ctx=>{ noiseFill(ctx, ["#8d8d8d","#828282","#979797","#787878"]); });
const texWoodSide = makeTexture(ctx=>{
  ctx.fillStyle="#6e4a28"; ctx.fillRect(0,0,16,16);
  for(let x=0;x<16;x+=3){ ctx.fillStyle="#5c3c20"; ctx.fillRect(x,0,1,16); }
});
const texWoodTop = makeTexture(ctx=>{
  ctx.fillStyle="#c9a06c"; ctx.fillRect(0,0,16,16);
  ctx.strokeStyle="#a9805080"; for(let r=2;r<9;r+=2){ ctx.beginPath(); ctx.arc(8,8,r,0,Math.PI*2); ctx.stroke(); }
});
const texLeaves = makeTexture(ctx=>{ noiseFill(ctx, ["#3f8f3a","#357a31","#4aa143","#2f6e2c"]); });
const texSand = makeTexture(ctx=>{ noiseFill(ctx, ["#ddd08a","#d3c37c","#e6d894"]); });

function mat(tex){ return new THREE.MeshLambertMaterial({ map: tex }); }
const M_GRASS_TOP = mat(texGrassTop), M_GRASS_SIDE = mat(texGrassSide), M_DIRT = mat(texDirt);
const M_STONE = mat(texStone), M_WOOD_SIDE = mat(texWoodSide), M_WOOD_TOP = mat(texWoodTop);
const M_LEAVES = mat(texLeaves), M_SAND = mat(texSand);

const boxGeo = new THREE.BoxGeometry(1,1,1);

const BLOCK_DEFS = {
  [GRASS]: { materials: [M_GRASS_SIDE,M_GRASS_SIDE,M_GRASS_TOP,M_DIRT,M_GRASS_SIDE,M_GRASS_SIDE], chunkMax: 260, name:"草" },
  [DIRT]:  { materials: M_DIRT, chunkMax: 500, name:"土" },
  [STONE]: { materials: M_STONE, chunkMax: 950, name:"石" },
  [WOOD]:  { materials: [M_WOOD_SIDE,M_WOOD_SIDE,M_WOOD_TOP,M_WOOD_TOP,M_WOOD_SIDE,M_WOOD_SIDE], chunkMax: 120, name:"木材" },
  [LEAVES]:{ materials: M_LEAVES, chunkMax: 260, name:"葉" },
  [SAND]:  { materials: M_SAND, chunkMax: 260, name:"砂" },
};
const dummy = new THREE.Object3D();

/* =========================================================
   チャンク管理
   ========================================================= */
const CHUNK_SIZE = 12;
const RENDER_DIST = 2;
const RENDER_DEPTH = 7;
const chunks = new Map();

function createChunkMeshSet(){
  const meshes = {};
  for(const t in BLOCK_DEFS){
    const def = BLOCK_DEFS[t];
    const im = new THREE.InstancedMesh(boxGeo, def.materials, def.chunkMax);
    im.count = 0;
    im.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    im.userData.max = def.chunkMax;
    scene.add(im);
    meshes[t] = im;
  }
  return meshes;
}

function buildChunk(cx,cz){
  const meshes = createChunkMeshSet();
  const lookup = {}; for(const t in BLOCK_DEFS) lookup[t] = [];
  const counts = {}; for(const t in BLOCK_DEFS) counts[t] = 0;
  const startX = cx*CHUNK_SIZE, startZ = cz*CHUNK_SIZE;

  function place(x,y,z,type){
    if(type===AIR) return;
    const t = String(type);
    if(!BLOCK_DEFS[t]) return;
    const idx = counts[t];
    if(idx >= meshes[t].userData.max) return;
    dummy.position.set(x+0.5,y+0.5,z+0.5);
    dummy.updateMatrix();
    meshes[t].setMatrixAt(idx, dummy.matrix);
    lookup[t][idx] = [x,y,z];
    counts[t]++;
  }

  for(let lx=0;lx<CHUNK_SIZE;lx++) for(let lz=0;lz<CHUNK_SIZE;lz++){
    const x = startX+lx, z = startZ+lz;
    const h = columnHeight(x,z);
    const top = h + 5;
    const bottom = Math.max(0, h-RENDER_DEPTH);
    for(let y=bottom;y<top;y++){
      const k = key(x,y,z);
      if(overrides.has(k)) continue;
      const type = terrainBlockAt(x,y,z);
      if(type!==AIR) place(x,y,z,type);
    }
  }
  overrides.forEach((type,k)=>{
    const parts = k.split(",").map(Number);
    const x=parts[0], y=parts[1], z=parts[2];
    if(x<startX || x>=startX+CHUNK_SIZE || z<startZ || z>=startZ+CHUNK_SIZE) return;
    if(type!==AIR) place(x,y,z,type);
  });

  for(const t in BLOCK_DEFS){
    meshes[t].count = counts[t];
    meshes[t].instanceMatrix.needsUpdate = true;
  }
  return { meshes, lookup, cx, cz };
}

function unloadChunk(chunkObj){
  for(const t in chunkObj.meshes) scene.remove(chunkObj.meshes[t]);
}

function updateChunks(){
  const pcx = Math.floor(player.pos.x/CHUNK_SIZE);
  const pcz = Math.floor(player.pos.z/CHUNK_SIZE);
  const needed = new Set();
  for(let dx=-RENDER_DIST; dx<=RENDER_DIST; dx++){
    for(let dz=-RENDER_DIST; dz<=RENDER_DIST; dz++){
      const cx = pcx+dx, cz = pcz+dz;
      const k = cx+","+cz;
      needed.add(k);
      if(!chunks.has(k)) chunks.set(k, buildChunk(cx,cz));
    }
  }
  chunks.forEach((chunkObj,k)=>{
    if(!needed.has(k)){ unloadChunk(chunkObj); chunks.delete(k); }
  });
}

function invalidateAllChunks(){
  chunks.forEach(chunkObj=>unloadChunk(chunkObj));
  chunks.clear();
}

/* =========================================================
   Firebase差分同期
   ========================================================= */
db.ref(ROOM + "/blocks").on("value", snap=>{
  const val = snap.val() || {};
  overrides.clear();
  Object.keys(val).forEach(k=>{
    const parts = k.split("_").map(Number);
    overrides.set(parts.join(","), val[k]);
  });
  invalidateAllChunks();
  updateChunks();
});

function pushBlockChange(x,y,z,type){
  overrides.set(key(x,y,z), type);
  invalidateAllChunks();
  updateChunks();
  db.ref(ROOM + "/blocks/" + x + "_" + y + "_" + z).set(type);
}

/* =========================================================
   プレイヤー
   ========================================================= */
const startY = columnHeight(0,0) + 3;
const player = {
  pos: new THREE.Vector3(0.5, startY, 0.5),
  vel: new THREE.Vector3(0,0,0),
  yaw: 0, pitch: -0.1,
  onGround: false,
  eyeHeight: 1.6,
};

function collides(px,py,pz){
  const r = 0.28;
  const heights = [0.05, 0.9, 1.55];
  for(const dx of [-r,r]) for(const dz of [-r,r]) for(const dy of heights){
    const bx = Math.floor(px+dx), by = Math.floor(py+dy), bz = Math.floor(pz+dz);
    const block = getBlock(bx,by,bz);
    if(block !== AIR && block !== LEAVES) return true;
  }
  return false;
}

/* =========================================================
   入力処理
   ========================================================= */
const input = { moveX:0, moveY:0, jump:false };

(function setupJoystick(){
  const base = document.getElementById("joyBase");
  const stick = document.getElementById("joyStick");
  let touchId = null, cx=0, cy=0;
  const maxR = 34;

  function start(e){
    const t = e.changedTouches ? e.changedTouches[0] : e;
    touchId = t.identifier ?? "mouse";
    const rect = base.getBoundingClientRect();
    cx = rect.left + rect.width/2; cy = rect.top + rect.height/2;
  }
  function move(e){
    const touches = e.changedTouches ? Array.from(e.changedTouches) : [e];
    for(const t of touches){
      if((t.identifier ?? "mouse") !== touchId) continue;
      const dXs = t.clientX - cx, dYs = t.clientY - cy;
      let { dx, dy } = toLogicalDelta(dXs, dYs);
      const dist = Math.min(maxR, Math.hypot(dx,dy));
      const ang = Math.atan2(dy,dx);
      dx = Math.cos(ang)*dist; dy = Math.sin(ang)*dist;
      stick.style.transform = `translate(${dx}px,${dy}px)`;
      input.moveX = dx/maxR; input.moveY = dy/maxR;
    }
  }
  function end(e){
    const touches = e.changedTouches ? Array.from(e.changedTouches) : [e];
    for(const t of touches){
      if((t.identifier ?? "mouse") !== touchId) continue;
      touchId = null; input.moveX = 0; input.moveY = 0;
      stick.style.transform = "translate(0,0)";
    }
  }
  base.addEventListener("touchstart", e=>{ e.preventDefault(); start(e); move(e); }, {passive:false});
  base.addEventListener("touchmove", e=>{ e.preventDefault(); move(e); }, {passive:false});
  base.addEventListener("touchend", e=>{ e.preventDefault(); end(e); }, {passive:false});
  base.addEventListener("mousedown", e=>{ start(e); const mv=ev=>move(ev), up=ev=>{end(ev); window.removeEventListener("mousemove",mv); window.removeEventListener("mouseup",up);}; window.addEventListener("mousemove",mv); window.addEventListener("mouseup",up); });
})();

(function setupLook(){
  const layer = document.getElementById("lookLayer");
  let touchId = null, lastX=0, lastY=0;
  const SENS = 0.0035;

  function start(e){
    const t = e.changedTouches ? e.changedTouches[0] : e;
    touchId = t.identifier ?? "mouse";
    lastX = t.clientX; lastY = t.clientY;
  }
  function move(e){
    const touches = e.changedTouches ? Array.from(e.changedTouches) : [e];
    for(const t of touches){
      if((t.identifier ?? "mouse") !== touchId) continue;
      const dXs = t.clientX - lastX, dYs = t.clientY - lastY;
      lastX = t.clientX; lastY = t.clientY;
      const { dx, dy } = toLogicalDelta(dXs, dYs);
      player.yaw -= dx*SENS;
      player.pitch -= dy*SENS;
      player.pitch = Math.max(-1.5, Math.min(1.5, player.pitch));
    }
  }
  function end(e){
    const touches = e.changedTouches ? Array.from(e.changedTouches) : [e];
    for(const t of touches){ if((t.identifier ?? "mouse") === touchId) touchId = null; }
  }
  layer.addEventListener("touchstart", e=>{ start(e); }, {passive:true});
  layer.addEventListener("touchmove", e=>{ move(e); }, {passive:true});
  layer.addEventListener("touchend", end, {passive:true});
  layer.addEventListener("mousedown", e=>{ start(e); const mv=ev=>move(ev), up=ev=>{end(ev); window.removeEventListener("mousemove",mv); window.removeEventListener("mouseup",up);}; window.addEventListener("mousemove",mv); window.addEventListener("mouseup",up); });
})();

document.getElementById("jumpBtn").addEventListener("touchstart", e=>{ e.preventDefault(); input.jump = true; }, {passive:false});
document.getElementById("jumpBtn").addEventListener("mousedown", ()=> input.jump = true);

// ★ 選択中のブロック
let selectedType = GRASS;

// ★ ホットバー構築（クリック選択可）
const HOTBAR_BLOCKS = [GRASS, DIRT, STONE, WOOD, LEAVES, SAND];
(function setupHotbar(){
  const bar = document.getElementById("hotbar");
  HOTBAR_BLOCKS.forEach((t,i)=>{
    const slot = document.createElement("div");
    slot.className = "hotslot" + (i===0 ? " selected":"");
    slot.dataset.blockType = t;
    
    // テクスチャ表示
    const c = document.createElement("canvas"); c.width=16; c.height=16;
    const ctx = c.getContext("2d");
    const def = BLOCK_DEFS[t];
    const m = Array.isArray(def.materials) ? def.materials[2] : def.materials;
    if(m && m.map) ctx.drawImage(m.map.image, 0,0);
    slot.appendChild(c);
    
    // カウント表示
    const countSpan = document.createElement("span");
    countSpan.className = "slot-count";
    countSpan.textContent = "0";
    slot.appendChild(countSpan);
    
    // ラベル（ブロック名の頭文字）
    const label = document.createElement("span");
    label.className = "slot-label";
    label.textContent = BLOCK_NAMES[t]?.charAt(0) || "?";
    slot.appendChild(label);
    
    // ★ クリック/タップで選択
    slot.addEventListener("touchstart", e=>{
      e.preventDefault();
      selectSlot(slot);
    }, {passive:false});
    slot.addEventListener("mousedown", (e)=>{
      e.preventDefault();
      selectSlot(slot);
    });
    
    bar.appendChild(slot);
  });
})();

function selectSlot(slot){
  // 全スロットの選択解除
  document.querySelectorAll(".hotslot").forEach(s => s.classList.remove("selected"));
  slot.classList.add("selected");
  selectedType = parseInt(slot.dataset.blockType);
  updateHotbarCounts();
}

// ホットバーのカウント更新
function updateHotbarCounts(){
  const slots = document.querySelectorAll(".hotslot");
  slots.forEach((slot)=>{
    const type = parseInt(slot.dataset.blockType);
    const count = getInventoryCount(type);
    const countEl = slot.querySelector(".slot-count");
    if(countEl) countEl.textContent = count > 0 ? count : "";
  });
}

const raycaster = new THREE.Raycaster();
raycaster.far = 7;
function raycastBlock(){
  raycaster.set(camera.position, camera.getWorldDirection(new THREE.Vector3()));
  let best = null, bestType = null, bestChunk = null;
  chunks.forEach(chunkObj=>{
    for(const t in chunkObj.meshes){
      const im = chunkObj.meshes[t];
      if(im.count === 0) continue;
      const hits = raycaster.intersectObject(im, false);
      if(hits.length && (!best || hits[0].distance < best.distance)){
        best = hits[0]; bestType = t; bestChunk = chunkObj;
      }
    }
  });
  if(!best) return null;
  const pos = bestChunk.lookup[bestType][best.instanceId];
  if(!pos) return null;
  return {
    x:pos[0], y:pos[1], z:pos[2],
    normal: best.face.normal.clone().transformDirection(bestChunk.meshes[bestType].matrixWorld),
    distance: best.distance
  };
}

document.getElementById("breakBtn").addEventListener("touchstart", e=>{ e.preventDefault(); doBreak(); }, {passive:false});
document.getElementById("breakBtn").addEventListener("mousedown", doBreak);
document.getElementById("placeBtn").addEventListener("touchstart", e=>{ e.preventDefault(); doPlace(); }, {passive:false});
document.getElementById("placeBtn").addEventListener("mousedown", doPlace);

function doBreak(){
  const hit = raycastBlock();
  if(!hit) return;
  const block = getBlock(hit.x, hit.y, hit.z);
  if(block === AIR || block === LEAVES) return;
  
  addToInventory(block, 1);
  pushBlockChange(hit.x, hit.y, hit.z, AIR);
}

function doPlace(){
  const hit = raycastBlock();
  if(!hit) return;
  
  if(getInventoryCount(selectedType) <= 0) return;
  
  const nx = hit.x + Math.round(hit.normal.x);
  const ny = hit.y + Math.round(hit.normal.y);
  const nz = hit.z + Math.round(hit.normal.z);
  const dx = Math.abs(nx+0.5-player.pos.x), dy = Math.abs(ny+0.5-player.pos.y-0.8), dz = Math.abs(nz+0.5-player.pos.z);
  if(dx<0.6 && dy<1.2 && dz<0.6) return;
  const block = getBlock(nx, ny, nz);
  if(block !== AIR) return;
  
  if(!useFromInventory(selectedType)) return;
  pushBlockChange(nx, ny, nz, selectedType);
}

/* =========================================================
   他プレイヤー表示
   ========================================================= */
const otherPlayers = {};
function makeNameSprite(name, colorHex){
  const c = document.createElement("canvas"); c.width=128; c.height=32;
  const ctx = c.getContext("2d");
  ctx.font="bold 20px sans-serif"; ctx.textAlign="center";
  ctx.fillStyle="rgba(0,0,0,.45)"; ctx.fillRect(0,4,128,24);
  ctx.fillStyle="#fff"; ctx.fillText(name.slice(0,10), 64, 22);
  const tex = new THREE.CanvasTexture(c);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest:false }));
  spr.scale.set(1.4,0.35,1);
  spr.position.y = 2.15;
  return spr;
}
function createOtherPlayerMesh(name, colorHex){
  const group = new THREE.Group();
  const bodyMat = new THREE.MeshLambertMaterial({ color: colorHex||0x4488ff });
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.5,1.1,0.3), bodyMat);
  body.position.y = 0.85;
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.45,0.45,0.45), new THREE.MeshLambertMaterial({ color:0xf0c090 }));
  head.position.y = 1.6;
  group.add(body, head, makeNameSprite(name, colorHex));
  scene.add(group);
  return group;
}

const playersRef = db.ref(ROOM + "/players");
playersRef.child(myId).onDisconnect().remove();

let lastSent = 0;
function sendMyState(now){
  if(now - lastSent < 120) return;
  lastSent = now;
  playersRef.child(myId).set({
    x: +player.pos.x.toFixed(2), y: +player.pos.y.toFixed(2), z: +player.pos.z.toFixed(2),
    yaw: +player.yaw.toFixed(2), name: myName, color: myColor, t: now
  });
}

playersRef.on("value", snap=>{
  const val = snap.val() || {};
  const activeIds = new Set(Object.keys(val));
  activeIds.forEach(id=>{
    if(id === myId) return;
    const d = val[id];
    if(!otherPlayers[id]){
      otherPlayers[id] = { group: createOtherPlayerMesh(d.name||"Player", d.color?parseInt(d.color.replace('#','0x')):0x4488ff), data:d };
    }
    const op = otherPlayers[id];
    op.data = d;
    op.group.position.set(d.x||0, d.y||0, d.z||0);
    op.group.rotation.y = (d.yaw||0) + Math.PI;
  });
  Object.keys(otherPlayers).forEach(id=>{
    if(!activeIds.has(id)){
      scene.remove(otherPlayers[id].group);
      delete otherPlayers[id];
    }
  });
  const list = Object.values(val).filter(d=>d).map(d=>d.name||"?");
  document.getElementById("playerList").textContent = "👥 " + (list.length||1) + "人: " + (list.join(", ")||myName);
});

/* =========================================================
   メインループ
   ========================================================= */
const clock = new THREE.Clock();
const SPEED = 4.3, GRAVITY = 20, JUMP_V = 7.2;
let fpsCount=0, fpsTimer=0;
let chunkTimer=0;
const coordsEl = document.getElementById("coords");

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());

  updateDayNight(dt);

  camera.rotation.set(player.pitch, player.yaw, 0, "YXZ");

  const forward = -input.moveY, strafe = input.moveX;
  const mag = Math.min(1, Math.hypot(forward,strafe));
  let vx=0, vz=0;
  if(mag > 0.05){
    const sinY = Math.sin(player.yaw), cosY = Math.cos(player.yaw);
    vx = (strafe*cosY - forward*sinY) * SPEED;
    vz = (-strafe*sinY - forward*cosY) * SPEED;
  }

  player.vel.y -= GRAVITY*dt;
  if(input.jump){
    if(player.onGround){ player.vel.y = JUMP_V; player.onGround=false; }
    input.jump = false;
  }

  let nx = player.pos.x + vx*dt;
  if(!collides(nx, player.pos.y, player.pos.z)) player.pos.x = nx;
  let nz = player.pos.z + vz*dt;
  if(!collides(player.pos.x, player.pos.y, nz)) player.pos.z = nz;
  let ny = player.pos.y + player.vel.y*dt;
  if(!collides(player.pos.x, ny, player.pos.z)){
    player.pos.y = ny; player.onGround = false;
  } else {
    if(player.vel.y < 0) player.onGround = true;
    player.vel.y = 0;
  }
  if(player.pos.y < -10){
    player.pos.y = columnHeight(Math.floor(player.pos.x), Math.floor(player.pos.z)) + 3;
    player.vel.set(0,0,0);
  }

  camera.position.set(player.pos.x, player.pos.y + player.eyeHeight, player.pos.z);

  chunkTimer += dt;
  if(chunkTimer > 0.35){ chunkTimer = 0; updateChunks(); }

  const now = performance.now();
  sendMyState(now);

  renderer.render(scene, camera);

  coordsEl.textContent = `X:${Math.floor(player.pos.x)} Y:${Math.floor(player.pos.y)} Z:${Math.floor(player.pos.z)}`;

  fpsCount++; fpsTimer += dt;
  if(fpsTimer > 1){ document.getElementById("fpsBadge").textContent = fpsCount+" fps"; fpsCount=0; fpsTimer=0; }
  
  updateHotbarCounts();
}

document.getElementById("startBtn").addEventListener("click", ()=>{
  const nameVal = document.getElementById("nameInput").value.trim();
  myName = nameVal || ("Player" + Math.floor(Math.random()*999));
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("hud").style.display = "block";
  resize();
  updateChunks();
  updateInventoryDisplay();
  updateHotbarCounts();
  animate();
});
